# =============================================================================
# Plugins
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'

# tmux-continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'

# Avoid tmux-resurrect's expensive default ps-based save strategy on macOS.
set -g @resurrect-save-command-strategy 'pgrep'

# tmux-resurrect: which programs to relaunch on restore.
# Defaults already cover: vi, vim, emacs, man, less, more, tail, top, htop,
# irssi, weechat, mutt. We add the ones actually used here.
#   nvim       — main editor (persistence.nvim handles session restore)
#   node       — dev servers; restores the binary but not the script args
#   lazygit    — popup git UI (rarely persisted but cheap to list)
#   btop/htop  — system monitors
#   python/uv  — REPLs / uv-run processes
set -g @resurrect-processes 'nvim node lazygit btop python python3 uv'

# Also capture visible pane text so context isn't lost on restore.
set -g @resurrect-capture-pane-contents 'on'

# Custom hook: save & restore `claude` panes (claude renames its process
# to its version string, so resurrect's normal matcher can't see it).
set -g @resurrect-hook-pre-save-all   'bash ~/.config/tmux/resurrect-claude.sh save'
set -g @resurrect-hook-post-restore-all 'bash ~/.config/tmux/resurrect-claude.sh restore'

# =============================================================================
# General
# =============================================================================

# Prefix: keep default Ctrl-b
set -g prefix C-b
bind C-b send-prefix

# Start window and pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # Re-number windows when one is closed

# Enable 256-color and true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer
set -g history-limit 10000

# Enable mouse (scroll, resize panes, click to focus)
set -g mouse on

# Reduce escape-time (important for vim — prevents delay on <Esc>)
set -sg escape-time 10

# Allow repeated key presses for 1 second after prefix (for -r bindings)
set -g repeat-time 1000

# Focus events (lets vim know when the terminal gains/loses focus)
set -g focus-events on

# =============================================================================
# Vim-style keybinds
# =============================================================================

# Vi-mode for navigating and copying text
setw -g mode-keys vi

# -----------------------------------------------------------------------------
# Scratchpad guards
#
# The M-i scratchpad is a real session (_scratch_*) on this same server, so
# every global binding also fires inside the popup — which meant you could open
# the session picker, switch to another session, or spawn tabs *inside* the
# scratchpad and end up with tmux nested in tmux.
#
# So: inside a scratch session, anything session- or window-scoped is either
#   blocked  — session pickers, switching sessions, creating/reordering tabs
#   passed through to the parent — tab switching (prefix 1..9) and the lazygit
#     / TODO popups, which close the scratchpad and act on the outer session
#     (see dispatch.sh)
# Splits (| and -), pane navigation, zoom and copy-mode still work — the
# scratchpad is one window with panes, nothing more.
#
# $SCRATCH is the format test; $NOPE is the "blocked" message. Bindings that
# need guarding are written as:  bind X if -F "${SCRATCH}" "${NOPE}" 'real cmd'
# -----------------------------------------------------------------------------
%hidden SCRATCH="#{m:_scratch_*,#{session_name}}"
%hidden NOPE="display -d 1200 '  not in the scratchpad'"

# Window switching by number. Routed through dispatch.sh so that pressing it
# inside the scratchpad closes the popup and switches the *parent's* tab,
# rather than doing nothing in a single-window scratch session.
bind 1 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 1"
bind 2 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 2"
bind 3 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 3"
bind 4 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 4"
bind 5 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 5"
bind 6 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 6"
bind 7 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 7"
bind 8 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 8"
bind 9 run-shell -b "~/.config/tmux/dispatch.sh window '#{session_name}' '#{client_name}' 9"

# Vim-style pane navigation with prefix + h/j/k/l (non-repeatable
# so the prefix releases immediately and following keys go straight
# to the pane, e.g. nvim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation disabled
unbind n
unbind p

# Quickly switch between the last two sessions
bind Tab if -F "${SCRATCH}" "${NOPE}" 'switch-client -l'

# Default session/window management keys, blocked inside the scratchpad
bind s   if -F "${SCRATCH}" "${NOPE}" 'choose-tree -Zs'
bind D   if -F "${SCRATCH}" "${NOPE}" 'choose-client -Z'
bind (   if -F "${SCRATCH}" "${NOPE}" 'switch-client -p'
bind )   if -F "${SCRATCH}" "${NOPE}" 'switch-client -n'
bind .   if -F "${SCRATCH}" "${NOPE}" 'command-prompt -T target "move-window -t \"%%\""'

# Easier zoom toggle (prefix + z still works)
bind m resize-pane -Z

# Repeatable window reordering
bind -r < if -F "${SCRATCH}" "${NOPE}" 'swap-window -d -t -1'
bind -r > if -F "${SCRATCH}" "${NOPE}" 'swap-window -d -t +1'

# Intuitive split bindings (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current path (the scratchpad is single-window by design)
bind c if -F "${SCRATCH}" "${NOPE}" 'new-window -c "#{pane_current_path}"'

# Copy-mode vim bindings: v to select, y to yank
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Quick reload of config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Kill current session (with confirmation)
bind X confirm-before -p "kill session '#S'? (y/n)" kill-session

# Top: Ctrl-\ (no prefix) or prefix + b — full-height overlay below the
# status bar; nothing resizes; close from inside with C-\ or Esc.
bind -n 'C-\' if -F "${SCRATCH}" "${NOPE}" "run-shell \"tmux display-popup -B -x 0 -y S -w 32 -h 100% -E 'bun ~/.config/tmux/sidebar/main.ts' 2>/dev/null || true\""
bind b       if -F "${SCRATCH}" "${NOPE}" "run-shell \"tmux display-popup -B -x 0 -y S -w 32 -h 100% -E 'bun ~/.config/tmux/sidebar/main.ts' 2>/dev/null || true\""

# Fzf picker: prefix + f — sessions by default, command palette when query starts with ':'
bind f if -F "${SCRATCH}" "${NOPE}" 'display-popup -B -w 30% -h 55% -E "~/.config/tmux/picker.sh"'

# Fzf window switcher: prefix + w (with preview of panes in window)
bind w if -F "${SCRATCH}" "${NOPE}" 'display-popup -w 60% -h 70% -E "~/.config/tmux/windows.sh"'

# Scratchpad: Alt-i (no prefix) — per-window persistent scratch terminal in a
# popup, mirroring nvchad's old <A-i> float. Each window (tab) gets its own
# scratch session (keyed by stable window_id, survives renumbering). Pressing
# M-i inside the popup detaches it (toggle); the session keeps running.
bind -n M-i run-shell -b "~/.config/tmux/scratch.sh '#{session_name}' '#{window_id}' '#{pane_current_path}' '#{client_name}'"

# Todo popup: prefix + t — ~/TODO.md in nvim, page-sized (narrow column,
# not a full-screen window). Overrides the default clock-mode binding.
# Lazygit popup: prefix + g — opens in the current pane's path.
#
# Both go through dispatch.sh: popups can't nest, so pressing these inside the
# scratchpad closes it and opens the popup on the PARENT client instead of
# doing anything inside the scratch session. Popup geometry lives in the script.
bind t run-shell -b "~/.config/tmux/dispatch.sh todo '#{session_name}' '#{client_name}'"
bind g run-shell -b "~/.config/tmux/dispatch.sh lazygit '#{session_name}' '#{client_name}' '#{pane_current_path}'"

# =============================================================================
# Flexoki Dark color palette
# https://stephango.com/flexoki
# =============================================================================

flexoki_black="#100f0f"
flexoki_base_950="#1c1b1a"
flexoki_base_900="#282726"
flexoki_base_850="#343331"
flexoki_base_800="#403e3c"
flexoki_base_700="#575653"
flexoki_base_600="#6f6e69"
flexoki_base_500="#878580"
flexoki_base_300="#b7b5ac"
flexoki_base_200="#cecdc3"

flexoki_red="#af3029"
flexoki_orange="#bc5215"
flexoki_yellow="#ad8301"
flexoki_green="#66800b"
flexoki_cyan="#24837b"
flexoki_blue="#205ea6"
flexoki_purple="#5e409d"
flexoki_magenta="#a02f6f"

flexoki_red_2="#d14d41"
flexoki_orange_2="#da702c"
flexoki_yellow_2="#d0a215"
flexoki_green_2="#879a39"
flexoki_cyan_2="#3aa99f"
flexoki_blue_2="#4385be"
flexoki_purple_2="#8b7ec8"

# Semantic aliases
color_bg=$flexoki_black
color_bg_2=$flexoki_base_950
color_ui=$flexoki_base_900
color_ui_2=$flexoki_base_850
color_ui_3=$flexoki_base_800
color_tx=$flexoki_base_200
color_tx_2=$flexoki_base_500
color_tx_3=$flexoki_base_700

# =============================================================================
# Status bar — top, centered
# =============================================================================

set -g status 2
set -g status-position top
set -g status-justify centre          # Center the window list

# Second line is a blank spacer for breathing room
set -g status-format[1] "#[bg=$color_bg]"

set -g status-bg $color_bg
set -g status-fg $color_tx

set -g status-left-length 40
set -g status-right-length 40

# Left: session name — green when normal, red when prefix is active
set -g status-left "#{?client_prefix,#[fg=$flexoki_black#,bg=$flexoki_red_2],#[fg=$flexoki_black#,bg=$flexoki_green_2]} #S #[default]"

# Right: time only
set -g status-right "#(~/.config/bin/servermode tmux)#[fg=$flexoki_base_500,bg=$color_bg] %H:%M "

# Window list (centered by status-justify centre)
setw -g window-status-format         "#[fg=$color_ui_3,bg=$color_bg] #I #[fg=$color_tx_3]#W#{?window_zoomed_flag,#[fg=$flexoki_orange_2] ✻,}  "
setw -g window-status-current-format "#[fg=$color_tx_2,bg=$color_ui] #I #[fg=$color_tx,bold]#W#{?window_zoomed_flag,#[fg=$flexoki_orange_2#,nobold] ✻,}  "
setw -g window-status-separator      ""

# Activity/bell: highlight windows where a process has finished
setw -g monitor-activity on
setw -g monitor-bell on
set  -g visual-activity off          # Don't flash a message, just style it
set  -g visual-bell off
set  -g activity-action other        # Only flag non-current windows

setw -g window-status-activity-style "fg=$flexoki_orange_2,bg=$color_bg,none"
setw -g window-status-bell-style     "fg=$flexoki_red_2,bg=$color_bg,none"

# =============================================================================
# Pane borders — subtle
# =============================================================================

set -g pane-border-style        "fg=$color_bg,bg=$color_bg"
set -g pane-active-border-style "fg=$color_bg,bg=$color_bg"
set -g pane-border-lines        single

set -g popup-border-style       "fg=$flexoki_base_700"
set -g popup-border-lines       "single"

# =============================================================================
# Messages and copy-mode
# =============================================================================

set -g message-style         "fg=$color_tx,bg=$color_ui_2"
set -g message-command-style "fg=$color_tx,bg=$color_ui_2"

setw -g mode-style           "fg=$flexoki_black,bg=$flexoki_orange_2,bold"
setw -g clock-mode-colour    $flexoki_blue_2

# =============================================================================
# Initialize TPM (keep at the very bottom)
# =============================================================================

run '~/.tmux/plugins/tpm/tpm'
